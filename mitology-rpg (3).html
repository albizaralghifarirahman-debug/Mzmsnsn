<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unicorn Fantasy RPG v8 🦄✨</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:none;font-family:'Comic Sans MS',cursive,sans-serif}
body{background:#0f0c29;height:100vh;width:100vw;overflow:hidden;display:flex;justify-content:center}
#gw{position:relative;width:100%;height:100%;max-width:1400px;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;background:#87CEEB}
#start{position:absolute;inset:0;background:linear-gradient(135deg,#FFD1FF,#87CEEB);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;transition:opacity .5s;padding:20px;text-align:center}
#start h1{font-size:2.4rem;color:#8A2BE2;text-shadow:4px 4px 0 #FFD700;margin-bottom:14px;animation:bn 2s infinite}
#start p{color:#FF1493;font-weight:bold;margin-bottom:12px}
#sb{padding:18px 46px;font-size:1.7rem;font-weight:bold;color:#fff;background:linear-gradient(45deg,#FF1493,#FF69B4);border:5px solid #fff;border-radius:60px;cursor:pointer;box-shadow:0 10px 0 #C71585}
#sb:active{transform:translateY(10px);box-shadow:none}
@keyframes bn{50%{transform:translateY(-15px)}}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.pn{background:rgba(255,255,255,.85);border:4px solid #FFD700;border-radius:20px;padding:8px 16px;box-shadow:0 6px 0 #FF8C00;font-weight:bold;color:#FF1493;display:flex;flex-direction:column;gap:4px}
.q{font-size:.85rem;color:#8A2BE2}
#mute{background:#fff;border:3px solid #00BFFF;border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;pointer-events:auto}
#mm{width:200px;height:100px;background:rgba(0,0,0,.5);border:3px solid #fff;border-radius:10px;margin-top:6px}
#mc{position:absolute;bottom:0;left:0;right:0;height:200px;pointer-events:none;z-index:100;display:flex;justify-content:space-between;padding:20px 30px;align-items:flex-end}
#jz{width:120px;height:120px;pointer-events:auto;position:relative}
#jb{width:100%;height:100%;background:rgba(255,255,255,.3);border:4px solid rgba(255,255,255,.8);border-radius:50%;position:absolute}
#js{width:60px;height:60px;background:rgba(255,105,180,.9);border:3px solid #fff;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.ab{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.b{width:60px;height:60px;background:rgba(255,215,0,.9);border:4px solid #fff;border-radius:50%;font-size:22px;box-shadow:0 6px 0 #FF8C00;cursor:pointer;color:#8B0000}
.b:active{transform:translateY(6px);box-shadow:none}
.bj{background:#00BFFF;box-shadow:0 6px 0 #00008B;color:#fff}.bf{background:#8A2BE2;box-shadow:0 6px 0 #4B0082;color:#fff}
.bs{background:#FF4500;box-shadow:0 6px 0 #8B0000;color:#fff}.bu{background:#4B0082;box-shadow:0 6px 0 #2E0854;color:#fff}
.cd{opacity:.4}
#ip{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(255,20,147,.95);color:#fff;padding:14px 28px;border-radius:30px;border:4px solid #fff;font-size:1.2rem;font-weight:bold;text-align:center;display:none;z-index:50}
#ban{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:2.2rem;font-weight:bold;color:#fff;opacity:0;z-index:60;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:999;transition:opacity .5s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:998}
@media(pointer:fine){#mc{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="gw">
<canvas id="c"></canvas><div id="flash"></div><div id="fade"></div><div id="ban"></div>
<div id="start"><h1>🦄 Unicorn Fantasy RPG 🌟</h1><p>Jurus baru: Sinar Pelangi, Matahari Api, Kristal Es, Blackhole!</p><p style="font-size:.9rem">PC: A/D jalan · W/Spasi lompat · J jurus · K ultimate · F/G ganti wujud · Enter interaksi · L Ultimate Alicorn (gauge penuh)</p><button id="sb">MULAI PETUALANGAN ✨</button></div>
<div id="hud">
<div class="pn"><div>🌟 Skor: <span id="us">0</span></div><div class="q" id="uq"></div><canvas id="mm" width="200" height="100"></canvas></div>
<div class="pn" style="align-items:flex-end;border-color:#0FF;box-shadow:0 6px 0 #008B8B"><div style="display:flex;gap:10px;align-items:center"><button id="mute">🔊</button><div>📍 <span id="uz">Hutan Kristal</span></div></div><div>🔮 Wujud: <span id="uf">Normal</span></div></div>
</div>
<div id="ip"></div>
<div id="mc"><div id="jz"><div id="jb"></div><div id="js"></div></div>
<div class="ab"><button class="b bf" id="bf">🦄</button><button class="b bs" id="bs">⚡</button><button class="b bu" id="bu">🌀</button><button class="b bj" id="bj">⬆️</button><button class="b" id="ba">✨</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),mctx=$('mm').getContext('2d');
let CW=innerWidth,CH=innerHeight;cv.width=CW;cv.height=CH;
const WW=6000,WH=Math.max(CH,900),IW=2000,GY=WH-150,TAU=Math.PI*2;
let state='START',zone='world',cam={x:0,y:0},time=0,shake=0,trans=false,score=0,sflash=0;

// ---------- AUDIO ----------
let ac,muted=false,bgm;
function initAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const m=[261.63,329.63,392,523.25,392,329.63,261.63,196];let n=0;bgm=setInterval(()=>{if(muted||state!=='PLAYING')return;tone('triangle',m[n++%8],m[(n-1)%8],.4,.04)},400)}}
function tone(t,f1,f2,d,v){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}
const SFX={jump:()=>tone('sine',300,600,.15,.2),collect:()=>tone('square',800,1200,.1,.1),cast:()=>tone('sawtooth',200,800,.3,.2),boom:()=>tone('sawtooth',120,20,.5,.35),ice:()=>tone('triangle',1800,600,.25,.15),zap:()=>tone('square',1400,300,.2,.1)};
const playSFX=t=>SFX[t]&&SFX[t]();

// ---------- DATA ----------
const FORMS={
Normal:{body:['#FFF','#FFE4E1'],mane:['#F00','#FF7F00','#FF0','#0F0','#00F','#4B0082','#8F00FF'],aura:'rgba(255,215,0,.8)',sc:'#FFD700',skill:'Sinar Pelangi',ult:'Nova Pelangi'},
Fire:{body:['#FF4500','#FF8C00'],mane:['#FF0','#F00','#8B0000'],aura:'rgba(255,69,0,.9)',sc:'#FF4500',skill:'Matahari Api',ult:'Hujan Meteor'},
Ice:{body:['#E0FFFF','#87CEFA'],mane:['#0FF','#FFF','#00F'],aura:'rgba(0,255,255,.9)',sc:'#00FFFF',skill:'Kristal Es',ult:'Badai Salju'},
Galaxy:{body:['#2E0854','#4B0082'],mane:['#FF69B4','#9400D3','#0FF'],aura:'rgba(147,112,219,.9)',sc:'#BA55D3',skill:'Blackhole',ult:'Supernova'}};
const FK=Object.keys(FORMS);let cf=0;
const P={x:500,y:WH-200,vx:0,vy:0,speed:8,jp:-18,g:.8,ground:true,face:1,wp:0,moving:false,inv:0,fly:false,flyT:0,slide:null,sp:0,sCD:0,uCD:0,cs:'idle',ct:0,pend:null};
const fairy={x:400,y:WH-300,ph:0};
const items=[],enemies=[],proj=[],parts=[],rings=[];
const npcs=[{id:'q',x:1200,y:WH-150,name:'Fairy Queen',quest:'Kumpulkan 5 💎',req:'💎',t:5,c:0,done:false,e:'🧚‍♀️'},{id:'p',x:2800,y:WH-250,name:'Cloud Princess',quest:'Kumpulkan 5 🌟',req:'🌟',t:5,c:0,done:false,e:'👸'},{id:'c',x:4800,y:WH-250,name:'Chef Gingerbread',quest:'Kumpulkan 5 🍫',req:'🍫',t:5,c:0,done:false,e:'👨‍🍳'}];
const doors=[{id:'crystal',x:700,label:'Istana Kristal'},{id:'cloud',x:3000,label:'Istana Awan'},{id:'choco',x:5400,label:'Istana Coklat'}];
const slides=[{sx:2300,sy:WH-350,ex:2600,ey:WH-150},{sx:4300,sy:WH-350,ex:4600,ey:WH-150}];
const RB=['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#8F00FF'];
for(let i=0;i<60;i++)items.push({x:300+Math.random()*(WW-600),y:WH-300-Math.random()*400,t:['💎','🌟','🍬','🍭','🍫','🍎'][i%6],ph:Math.random()*TAU,got:false});
for(let i=0;i<25;i++)enemies.push({x:1000+Math.random()*(WW-2000),y:GY,ph:Math.random()*TAU,sp:1+Math.random()*2,fr:0,dead:false});

// ---------- INPUT ----------
const K={L:0,R:0,Sp:0,Act:0,Sk:0,Ul:0};let joy={x:0,active:false},jc={x:0,y:0};
const map={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'Sp',KeyW:'Sp',Space:'Sp',KeyJ:'Sk',KeyK:'Ul',Enter:'Act'};
addEventListener('keydown',e=>{if(map[e.code]){K[map[e.code]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.code])K[map[e.code]]=0});
const jz=$('jz'),js=$('js');
function uj(t){let dx=t.clientX-jc.x,dy=t.clientY-jc.y,d=Math.hypot(dx,dy);if(d>60){dx=dx/d*60;dy=dy/d*60}js.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;joy.x=dx/60}
jz.addEventListener('touchstart',e=>{e.preventDefault();initAudio();const r=jz.getBoundingClientRect();jc={x:r.left+60,y:r.top+60};joy.active=true;uj(e.touches[0])},{passive:false});
jz.addEventListener('touchmove',e=>{e.preventDefault();if(joy.active)uj(e.touches[0])},{passive:false});
jz.addEventListener('touchend',e=>{e.preventDefault();joy.active=false;joy.x=0;js.style.transform='translate(-50%,-50%)'},{passive:false});
function bind(id,k){const el=$(id),s=e=>{e.preventDefault();initAudio();K[k]=1},n=e=>{e.preventDefault();K[k]=0};el.addEventListener('touchstart',s,{passive:false});el.addEventListener('touchend',n,{passive:false});el.addEventListener('mousedown',s);el.addEventListener('mouseup',n);el.addEventListener('mouseleave',n)}
bind('bj','Sp');bind('ba','Act');bind('bs','Sk');bind('bu','Ul');
$('bf').addEventListener('touchstart',e=>{e.preventDefault();changeForm()},{passive:false});$('bf').addEventListener('mousedown',changeForm);
$('mute').onclick=()=>{muted=!muted;$('mute').innerText=muted?'🔇':'🔊';if(ac)muted?ac.suspend():ac.resume()};

function changeForm(){initAudio();cf=(cf+1)%FK.length;fixHp();$('uf').innerText=FK[cf];playSFX('collect');burst(P.x,P.y-30,FORMS[FK[cf]].aura,30,3,11,.95)}

// ---------- FX HELPERS ----------
function burst(x,y,c,n,s0,s1,fr,sz){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=s0+Math.random()*(s1-s0);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:c,size:(sz||5)+Math.random()*6,fr:fr||.93,decay:.02})}}
function pull(x,y,c,n,d0){for(let i=0;i<n;i++){const a=Math.random()*TAU,d=d0+Math.random()*100;parts.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,tx:x,ty:y,life:1,color:c,size:3+Math.random()*4,charge:1,decay:.02})}}
function ring(x,y,max,c,hue,dmg){rings.push({x,y,r:10,max,life:1,color:c,hue,dmg})}
function kill(e,pts,col){if(e.dead)return;e.dead=true;score+=pts;burst(e.x,e.y,col,12,3,9,.9);setTimeout(()=>{e.x=1000+Math.random()*(WW-2000);e.dead=false;e.fr=0},3000)}
function boom(x,y,r,pts,col,n){burst(x,y,col,n||30,4,14,.92,6);ring(x,y,r,col);sflash=.3;shake=Math.max(shake,14);playSFX('boom');enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r)kill(e,pts,col)})}
function banner(t,c){const b=$('ban');b.innerText=t;b.style.color=c;b.style.textShadow=`0 0 20px ${c},0 4px 0 #000`;b.style.opacity=1;setTimeout(()=>b.style.opacity=0,900)}

// ---------- SKILLS ----------
function trig(kind){if(P.cs!=='idle')return;if(kind==='skill'?P.sCD>0:P.uCD>0)return;P.cs='charging';P.ct=kind==='skill'?18:28;P.pend=kind;kind==='skill'?P.sCD=60:P.uCD=180;playSFX('cast');const f=FORMS[FK[cf]];banner(kind==='skill'?f.skill:'✦ '+f.ult+' ✦',f.sc);pull(P.x+P.face*50,P.y-40,f.sc,kind==='skill'?30:55,kind==='skill'?200:320)}
function fireSkill(){const n=FK[cf],f=FORMS[n],px=P.x+P.face*55,py=P.y-45,d=P.face;
 if(n==='Normal')proj.push({t:'beam',x:px,y:py,vx:d*28,vy:0,life:50,c:f.sc,hit:[]});
 else if(n==='Fire')proj.push({t:'sun',x:px,y:py,vx:d*15,vy:0,life:90,c:f.sc,r:42});
 else if(n==='Ice')for(let i=-2;i<=2;i++)proj.push({t:'ice',x:px,y:py,vx:d*20,vy:i*2.5,life:70,c:'#7FFFFF',a:Math.atan2(i*2.5,d*20)});
 else proj.push({t:'hole',x:P.x+d*160,y:py,vx:0,vy:0,life:300,r:10,mr:80,ang:0,c:f.sc})}
function fireUlt(){const n=FK[cf],f=FORMS[n];shake=26;sflash=.7;playSFX('boom');
 if(n==='Normal'){P.fly=true;P.flyT=170;ring(P.x,P.y,520,'#FFF',true);ring(P.x,P.y,380,'#FFF',true);burst(P.x,P.y,'#FFD700',40,4,12,.94);for(let i=0;i<60;i++){const a=Math.random()*TAU;parts.push({x:P.x,y:P.y,vx:Math.cos(a)*11,vy:Math.sin(a)*11,life:1,color:`hsl(${Math.random()*360},100%,65%)`,size:5+Math.random()*7,fr:.94,decay:.02})}enemies.forEach(e=>{if(Math.hypot(e.x-P.x,e.y-P.y)<520)kill(e,70,'#FFD700')})}
 else if(n==='Fire'){for(let i=0;i<14;i++)proj.push({t:'meteor',x:P.x+(Math.random()-.5)*900,y:P.y-700-Math.random()*400,vx:-4-Math.random()*3,vy:17+Math.random()*4,life:140,c:'#FF4500',r:34});ring(P.x,P.y,200,'#FF4500')}
 else if(n==='Ice'){ring(P.x,P.y,600,'#BFFFFF');ring(P.x,P.y,420,'#00FFFF');for(let i=0;i<24;i++){const a=i/24*TAU;proj.push({t:'ice',x:P.x,y:P.y-30,vx:Math.cos(a)*15,vy:Math.sin(a)*15,life:50,c:'#7FFFFF',a})}enemies.forEach(e=>{if(Math.abs(P.x-e.x)<600&&!e.dead)e.fr=360})}
 else{ring(P.x,P.y,900,'#FFD700');ring(P.x,P.y,600,'#BA55D3');burst(P.x,P.y,'#FFD700',90,4,16,.93,6);for(let i=0;i<16;i++){const a=i/16*TAU;proj.push({t:'star',x:P.x,y:P.y-30,vx:Math.cos(a)*22,vy:Math.sin(a)*22,life:35,c:i%2?'#FFD700':'#FF69B4'})}enemies.forEach(e=>{if(Math.abs(P.x-e.x)<1000&&!e.dead)setTimeout(()=>kill(e,150,'#FFD700'),Math.abs(P.x-e.x)*.8)})}}

function changeScene(z,x,y){if(trans)return;trans=true;$('fade').style.opacity=1;setTimeout(()=>{zone=z;P.x=x;P.y=y;P.vx=P.vy=0;cam.x=x-CW/2;cam.y=y-CH/2;$('fade').style.opacity=0;setTimeout(()=>trans=false,500)},500)}

// ---------- UPDATE ----------
function updProj(){
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.life--;
  if(p.t==='hole'){p.ang+=.12;if(p.r<p.mr)p.r+=1.5;
   enemies.forEach(e=>{if(e.dead)return;const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<420){e.x+=dx*.07;e.y+=dy*.07;if(d<35)kill(e,40,'#9400D3')}});
   if(time%2===0)pull(p.x,p.y,Math.random()<.5?'#BA55D3':'#FFD700',2,160);
   if(p.life<=0){boom(p.x,p.y,260,60,'#BA55D3',50);ring(p.x,p.y,300,'#FFD700')}}
  else{p.x+=p.vx;p.y+=p.vy;
   if(p.t==='beam'){for(let k=0;k<2;k++)parts.push({x:p.x-p.vx*Math.random(),y:p.y+(Math.random()-.5)*26,vx:0,vy:(Math.random()-.5)*2,life:.8,color:`hsl(${(time*14+k*80)%360},100%,65%)`,size:3+Math.random()*4,fr:.95,decay:.03});
    enemies.forEach(e=>{if(!e.dead&&!p.hit.includes(e)&&Math.abs(p.x-e.x)<60&&Math.abs(p.y-e.y)<70){p.hit.push(e);kill(e,50,'#FFD700');shake=10;playSFX('zap')}})}
   else if(p.t==='sun'||p.t==='meteor'){for(let k=0;k<3;k++)parts.push({x:p.x+(Math.random()-.5)*p.r,y:p.y+(Math.random()-.5)*p.r,vx:-p.vx*.1+(Math.random()-.5)*2,vy:-1-Math.random()*2,life:.9,color:['#FFE066','#FF6A00','#8B0000'][k],size:5+Math.random()*9,fr:.95,decay:.035});
    const hitE=enemies.some(e=>!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<p.r+25);
    if(hitE||p.y>=GY||p.life<=0){boom(p.x,Math.min(p.y,GY),p.t==='sun'?170:130,80,'#FF4500',p.t==='sun'?45:28);p.life=0}}
   else if(p.t==='ice'){if(time%2===0)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:.7,color:Math.random()<.5?'#FFF':'#0FF',size:2+Math.random()*4,fr:.96,decay:.03});
    enemies.forEach(e=>{if(p.life>0&&!e.dead&&Math.hypot(p.x-e.x,p.y-e.y)<50){playSFX('ice');if(e.fr>0){kill(e,90,'#BFFFFF');burst(e.x,e.y,'#FFF',20,3,10,.9)}else{e.fr=240;burst(e.x,e.y,'#0FF',10,2,6,.9)}p.life=0}})}
   else if(p.t==='star'){parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.8,color:p.c,size:5,fr:1,decay:.05})}
  }
  if(p.life<=0||p.x<-300||p.x>WW+300||p.y>WH+300)proj.splice(i,1)}
}
function update(){
 if(state!=='PLAYING'||trans)return;time++;
 try{
 if(P.sCD>0)P.sCD--;if(P.uCD>0)P.uCD--;
 sflash=Math.max(0,sflash-.03);$('flash').style.opacity=sflash;
 $('bs').classList.toggle('cd',P.sCD>0);$('bu').classList.toggle('cd',P.uCD>0);
 if(P.cs!=='idle'){P.ct--;if(P.cs==='charging'&&P.ct<=0){P.pend==='skill'?fireSkill():fireUlt();P.cs='rec';P.ct=12}else if(P.cs==='rec'&&P.ct<=0)P.cs='idle'}
 if(P.slide){P.sp+=.025;P.x=P.slide.sx+(P.slide.ex-P.slide.sx)*P.sp;P.y=P.slide.sy+(P.slide.ey-P.slide.sy)*P.sp;
  parts.push({x:P.x,y:P.y+40,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:.8,color:RB[Math.floor(Math.random()*7)],size:5,fr:.95,decay:.04});
  if(P.sp>=1){P.slide=null;P.vy=-5}}
 else{
  let mx=(K.R?1:0)-(K.L?1:0);if(joy.active)mx=joy.x*1.5;
  if(mx&&P.cs==='idle'){P.vx=mx*P.speed;P.face=mx>0?1:-1;P.moving=true}else{P.vx*=.8;P.moving=false}
  if(K.Sk){K.Sk=0;trig('skill')}if(K.Ul){K.Ul=0;trig('ult')}
  if(K.Sp&&P.ground&&P.cs==='idle'){P.vy=P.jp;P.ground=false;playSFX('jump');K.Sp=0}
  if(P.fly){P.flyT--;P.vy=Math.sin(time*.1)*5-5;if(Math.random()>.4)parts.push({x:P.x+(Math.random()-.5)*60,y:P.y+30,vx:(Math.random()-.5)*3,vy:-2,life:1,color:`hsl(${Math.random()*360},100%,70%)`,size:6,fr:.97,decay:.02});if(P.flyT<=0)P.fly=false}else P.vy+=P.g;
  P.x+=P.vx;P.y+=P.vy;
  if(P.y>GY&&!P.fly){P.y=GY;P.vy=0;P.ground=true}if(P.fly)P.ground=false;
  if(zone==='world')slides.forEach(s=>{if(!P.slide&&Math.hypot(P.x-s.sx,P.y-s.sy)<50){P.slide=s;P.sp=0}})}

function drawCreature(n){const w=P.wp*2,mv=P.moving?1:.12,A=Math.sin(w)*mv,B=Math.sin(w+Math.PI)*mv,c=CR[n];ctx.save();ctx.shadowBlur=0;ctx.translate(0,50);ctx.scale(c[1],c[1]);ctx.translate(0,-50);ctx.lineCap='round';ctx.lineJoin='round';c[0](w,time,A,B);ctx.restore();
